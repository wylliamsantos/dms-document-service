spring:
  config:
    activate:
      on-profile: local
    import: "optional:configserver:"  # disable vault/import during local runs
  cloud:
    vault:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dms}
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  http:
    multipart:
      max-file-size: 11MB
      max-request-size: 10MB
  data:
    mongodb:
      uri: mongodb://dms:dms@localhost:27017/dms?authSource=dms
logging:
  level:
    br.com.dms: DEBUG
dms:
  fallback:
    enabled: true
  audit:
    enabled: true
    exchange: audit.events
    routing-key: audit.#
  ocr:
    enabled: true
    base-url: ${DMS_OCR_BASE_URL:http://localhost:8093}
    max-attempts: 3
    retry-delay-ms: 1500
    max-pages: 3
  ai:
    rag:
      document:
        enabled: ${DMS_AI_RAG_DOCUMENT_ENABLED:true}
    chat:
      document:
        enabled: ${DMS_AI_CHAT_DOCUMENT_ENABLED:true}
    provider:
      local:
        enabled: ${DMS_AI_PROVIDER_LOCAL_ENABLED:true}
        base-url: ${DMS_AI_PROVIDER_LOCAL_BASE_URL:http://localhost:11434}
        model: ${DMS_AI_PROVIDER_LOCAL_MODEL:llama3.1:8b}
        connect-timeout-ms: ${DMS_AI_PROVIDER_LOCAL_CONNECT_TIMEOUT_MS:5000}
        read-timeout-ms: ${DMS_AI_PROVIDER_LOCAL_READ_TIMEOUT_MS:120000}
  s3:
    region: us-east-1
    bucket-name: dms-local
    endpoint: http://localhost:9000
    access-key: dms
    secret-key: dmssecret
  contentTypes: "image/jpeg#image/png#image/tiff#application/pdf#text/plain#image/bmp#application/octet-stream#video/mp4#video/webm#video/ogg"
  hashAlgorithm: MD5
  msg:
    base64Invalid: Não foi possível utilizar o base64 informado
    payloadInvalid: Body não enviado
    jsonMetadataError: Json metadata com formato incorreto
    unknowError: Erro ao acessar o DMS
    lockError: "Não foi possível realizar a operação de lock. Código HTTP retornado: %s"
    invalidLockKey: Lock Key inválida para esse documento
    alreadyLock: O documento já está em lock
    notLocked: O documento não está em lock
    mimeTypeInvalid: Mime type do arquivo não suportado
    typeInvalid: Tipo de documento não suportado
    checkDuplicateError: Não foi possível verificar se o documento já existe no DMS
    typeDocumentInvalid: Tipo de documento não configurado ou configurado incorretamente
    issuingDateIsMandatory: Data de emissão/referência obrigatória para o tipo de documento informado
    authorIsMandatory: Author é obrigatório
    filenameIsMandatory: Nome do arquivo é obrigatório
    categoryIsMandatory: Categoria é obrigatória
    unsuportedOperation: Operação não suportada ou não implementada
aws:
  s3:
    expiration: 5000

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info

timestamp-authority:
  url: http://localhost
  #url: http://sha256timestamp.ws.symantec.com/sha256/timestamp
  connectTimeout: 10000

signature:
  private-key: ""
  certificate: ""

allowDigitalSignature: false
